<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmileCheck — Sem ligação</title>
<meta name="theme-color" content="#0D2137" />
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #021931; color: #f1f5f9; text-align: center; padding: 24px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.25rem; margin: 20px 0 8px; }
  p { margin: 4px 0; color: #cbd5e1; font-size: 0.95rem; max-width: 32ch; }
  button { margin-top: 20px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #1565C0; color: #fff; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="" width="96" height="96" />
    <h1 data-pt="Sem ligação à internet" data-fr="Pas de connexion Internet" data-en="No internet connection">Sem ligação à internet</h1>
    <p data-pt="Ligue-se à internet para ver as suas consultas e dados." data-fr="Connectez-vous à Internet pour voir vos rendez-vous et vos données." data-en="Connect to the internet to see your appointments and data.">Ligue-se à internet para ver as suas consultas e dados.</p>
    <button type="button" onclick="location.reload()" data-pt="Tentar novamente" data-fr="Réessayer" data-en="Try again">Tentar novamente</button>
  </main>
  <script>
    try {
      var l = (localStorage.getItem('i18nextLng') || navigator.language || 'pt').slice(0, 2);
      if (l === 'fr' || l === 'en') {
        document.documentElement.lang = l;
        document.querySelectorAll('[data-' + l + ']').forEach(function (el) { el.textContent = el.getAttribute('data-' + l); });
      }
    } catch (e) {}
  </script>
</body>
</html>
